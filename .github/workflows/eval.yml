name: Agent Evaluation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run evaluations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Always generate reports when possible; gate step is the blocker.
          agent-eval run-all-scenarios || true

      - name: Enforce policy gate
        run: |
          agent-eval check-gate \
            --report-file reports/evaluation_report.json \
            --policy-file policy/release_gate.enterprise.yaml

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: reports/
